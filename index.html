<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#F1EFF8">
<title>Train</title>
<style>
:root{--bg:#F1EFF8;--card:#fff;--ink:#1B1530;--soft:#6F6987;--line:#E2DEEE;--acc:#5B3DF5;--ok:#0E9F7A;--bad:#D23C5A;--accbg:#E8E3FF}
@media (prefers-color-scheme:dark){:root{--bg:#14111F;--card:#1F1B2E;--ink:#F1EEFA;--soft:#A29BBD;--line:#322D47;--acc:#9A86FF;--ok:#3CD3AA;--bad:#FF7A93;--accbg:#2B2450}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{margin:0;font-size:1.05rem;font-weight:700}
.top small{color:var(--soft);font-size:.82rem}
.rb{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.1rem}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:.72rem;color:var(--soft)}
.day b{font-size:1.05rem;color:var(--ink);font-weight:650}
.day.today b{color:var(--acc)}
.day.today:not(.sel){border-color:var(--acc);background:var(--accbg)}
.day.today.sel{box-shadow:0 0 0 2px var(--acc)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel b{color:var(--bg)}
.day i{width:5px;height:5px;border-radius:50%;margin-top:2px}
.day.has i{background:var(--ok)}
.day.plan i{background:var(--line)}
.day.plan.has i{background:var(--ok)}
.hero{margin:0 2px 14px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero h2{margin:0;font-size:1.8rem;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero p{margin:6px 0 10px;color:var(--soft);font-size:.9rem}
.pill{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.88rem;color:var(--acc)}
.pill.solid{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .25s}
.group{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.group h3{margin:0;padding:13px 16px 8px;font-size:.95rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.group h3 span{color:var(--soft);font-weight:500;font-size:.82rem}
.ex{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 16px;min-height:56px;border-top:1px solid var(--line)}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.tick svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.on>.tick{background:var(--ok);border-color:var(--ok)}
.on>.tick svg{opacity:1}
.steps.on>.tick{background:var(--acc);border-color:var(--acc)}
.ex .nm{flex:1;font-weight:550}
.ex .rx{color:var(--soft);font-size:.86rem;white-space:nowrap}
.ex.on .nm{color:var(--soft);text-decoration:line-through}
.rest{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:12px;color:var(--soft);font-size:.95rem}
.rest b{display:block;color:var(--ink);margin-bottom:4px;font-size:1rem}
.daily{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.daily h3{margin:0;padding:13px 16px 8px;font-size:.95rem}
.steps{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line);min-height:56px}
.steps .nm{flex:1;font-weight:550}
small.s{display:block;color:var(--soft);font-weight:400;font-size:.8rem}
.cardio{display:flex;align-items:center;gap:13px;padding:12px 16px;border-top:1px solid var(--line);min-height:56px}
.cardio .nm{flex:1;font-weight:550}
input.t,select.t{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem;min-width:0;width:100%}
input.t:focus,select.t:focus{outline:2px solid var(--acc);border-color:transparent}
.cardio input{width:92px;text-align:right}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.wh.today{background:var(--accbg)}
.wh .d{font-weight:550}
.wh small{color:var(--soft);margin-left:8px;font-size:.82rem}
/* edit */
.erow{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.erow .en{flex:1}
.erow .er{width:92px;flex:none}
.ib{flex:none;width:34px;height:40px;border-radius:10px;border:1px solid var(--line);color:var(--soft);font-size:1rem}
.ib.del{color:var(--bad)}
.add{display:block;width:100%;padding:13px 16px;text-align:left;border-top:1px solid var(--line);color:var(--acc);font-weight:600}
.ghead{padding:12px 12px 6px;display:flex;gap:6px}
.ghead input{font-weight:700}
.edtools{margin:14px 2px;display:flex;flex-direction:column;gap:10px}
.edtools label{font-size:.82rem;color:var(--soft)}
.lnk{color:var(--bad);font-weight:600;padding:10px 2px;text-align:left}
/* week */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.stat b{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;display:block}
.stat span{color:var(--soft);font-size:.76rem}
.wd{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
.wd.rest0{opacity:.6}
.wd .l1{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}
.wd .l1 b{font-weight:650}
.wd .l1 span{color:var(--soft);font-size:.84rem}
.wd .tags{display:flex;gap:8px;margin-top:8px;font-size:.8rem;color:var(--soft)}
.tag{padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.tag.y{color:var(--ok);border-color:var(--ok)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{display:flex;max-width:560px;margin:0 auto}
.tabbar button{flex:1;padding:12px 0 11px;font-size:.8rem;font-weight:600;color:var(--soft)}
.tabbar button.act{color:var(--acc)}

:root{--glass:rgba(255,255,255,.82);--sh:0 1px 2px rgba(27,21,48,.05),0 10px 24px -14px rgba(60,40,160,.35)}
@media (prefers-color-scheme:dark){:root{--glass:rgba(31,27,46,.85);--sh:0 10px 24px -14px rgba(0,0,0,.7)}}
body{background:linear-gradient(180deg,var(--accbg),var(--bg) 300px) var(--bg) no-repeat}
.top h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.rb{box-shadow:var(--sh);border:0}
.day,.group,.daily,.stat,.wd,.rest{border:0;box-shadow:var(--sh);border-radius:20px}
.day{border-radius:16px;transition:transform .12s}
.day.today:not(.sel){box-shadow:inset 0 0 0 2px var(--acc)}
.day.sel{background:linear-gradient(160deg,var(--acc),#7A5CFF);color:#fff}
.day.sel b{color:#fff}
.day.sel.today{box-shadow:0 0 0 3px var(--accbg),0 0 0 5px var(--acc)}
.ex:active,.steps:active,.day:active,.pill:active,.wd:active,.ib:active{transform:scale(.97);opacity:.85}
.tick{width:30px;height:30px;transition:all .15s}
.hero h2{font-size:2rem}
.pg{display:flex;gap:6px;flex:none}
.pill{box-shadow:var(--sh);border:0;padding:8px 12px;font-size:.82rem}
.pill.solid{background:linear-gradient(160deg,var(--acc),#7A5CFF)}
.bar{height:10px}.bar i{background:linear-gradient(90deg,var(--ok),#5BE0B8)}
.stat b{font-size:1.6rem}
.big{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 8px}
.big span{font-size:1.1rem;font-weight:600;color:var(--soft);letter-spacing:0}
.chip{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:650;font-size:.82rem}
.step{display:flex;gap:12px;align-items:center;padding:6px 16px 16px}
.step input{text-align:center;font-size:1.7rem;font-weight:750;flex:1;padding:8px}
.step .ib{width:54px;height:54px;border-radius:50%;font-size:1.6rem;background:var(--accbg);color:var(--acc);border:0}
.seg{display:flex;background:var(--line);border-radius:13px;padding:3px;margin:0 0 12px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:650;font-size:.88rem;color:var(--soft)}
.seg .act{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tabbar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;padding:9px 0 8px}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1 id="ttl">Training</h1><small id="range"></small></div>
    <div><button class="rb" data-a="prev" aria-label="Previous week">‹</button> <button class="rb" data-a="next" aria-label="Next week">›</button></div>
  </div>
  <div class="strip" id="strip"></div>
  <div id="view"></div>
</div>
<nav class="tabbar"><div>
  <button data-a="tab" data-v="day" id="tDay"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Workout</button>
  <button data-a="tab" data-v="week" id="tWeek"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Week</button>
  <button data-a="tab" data-v="wt" id="tWt"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 9.5a4.5 3 0 0 1 7 0M12 12l2-2"/></svg>Weight</button>
</div></nav>
<script>
(function(){
"use strict";
var KEY="train-v4",DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function uid(){return "x"+Math.random().toString(36).slice(2,9)}
function X(n,r){return {id:uid(),n:n,r:r}}
function G(n,xs){return {n:n,x:xs}}
function rest(){return {t:"Rest day",g:[]}}
function defPlan(){return [
 rest(),rest(),
 {t:"Back + Biceps",g:[G("Back",[X("Lat pulldown","4 × 8–12"),X("Row on machine","3 × 10–12"),X("Dumbbell row","3 × 10 / side")]),G("Biceps",[X("Bicep curl","3 × 10–12"),X("Hammer curls","3 × 12")])]},
 rest(),
 {t:"Legs + Core",g:[G("Quads & glutes",[X("Squats","4 × 8–10"),X("Bulgarian split squat","3 × 10 / leg")]),G("Core",[X("Dead bug","3 × 10 / side"),X("Cable crunches","3 × 12–15")])]},
 {t:"Shoulders + Triceps",g:[G("Shoulders",[X("Dumbbell shoulder press","4 × 8–10"),X("Lateral raises","4 × 12–15"),X("Around the world","3 × 12")]),G("Triceps",[X("Tricep pushdown","3 × 12"),X("Tricep whole pushdown","3 × 10–12"),X("Tricep pull up","3 × 8–10")])]},
 {t:"Hamstrings + Glutes + Cardio",g:[G("Hamstrings & glutes",[X("RDL","4 × 8–10"),X("Lunges","3 × 12 / leg")]),G("Core",[X("Crunches","3 × 15")]),G("Cardio",[X("Incline walk or intervals","20 min")])]}
]}
var S={plan:defPlan(),log:{},wt:{base:70,log:{}}};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.plan&&o.plan.length===7)S.plan=o.plan;if(o&&o.log)S.log=o.log;if(o&&o.wt&&o.wt.log&&typeof o.wt.base==='number')S.wt=o.wt}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function mon(d){return add(d,-((d.getDay()+6)%7))}
function now(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function fromIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
var todayIso=iso(now()),wk=mon(now()),sel=todayIso,tab="day",edit=false;
function ent(k){return S.log[k]||(S.log[k]={ex:[],steps:false,kcal:0})}
function idxOf(k){return (fromIso(k).getDay()+6)%7}
function ids(p){var a=[];p.g.forEach(function(g){g.x.forEach(function(x){a.push(x.id)})});return a}
function doneCount(p,e){return ids(p).filter(function(i){return e.ex.indexOf(i)>-1}).length}
var CK='<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>';

function render(){
  var days=[],i;for(i=0;i<7;i++)days.push(add(wk,i));
  var a=days[0],b=days[6];
  document.getElementById("range").textContent=a.getDate()+" "+MN[a.getMonth()]+" – "+b.getDate()+" "+MN[b.getMonth()];
  document.getElementById("tDay").className=tab==="day"?"act":"";
  document.getElementById("tWeek").className=tab==="week"?"act":"";
  document.getElementById("tWt").className=tab==="wt"?"act":"";
  var st="";
  days.forEach(function(d,j){var k=iso(d),e=S.log[k],has=(e&&(e.ex.length||e.steps||e.kcal))||S.wt.log[k],pl=S.plan[j].g.length;
    st+='<button class="day'+(k===sel?' sel':'')+(k===todayIso?' today':'')+(has?' has':'')+(pl?' plan':'')+'" data-a="day" data-k="'+k+'">'+DN[j]+'<b>'+d.getDate()+'</b><i></i></button>'});
  document.getElementById("strip").innerHTML=st;
  document.getElementById("view").innerHTML=tab==="week"?weekView(days):tab==="wt"?weightView():dayView();
}

function dayView(){
  var idx=idxOf(sel),p=S.plan[idx],e=S.log[sel]||{ex:[],steps:false,kcal:0},n=ids(p).length,dn=doneCount(p,e),h="";
  if(edit)return editView(idx,p);
  h+='<div class="hero"><div class="row"><h2>'+esc(p.t)+'</h2><span class="pg"><button class="pill" data-a="tab" data-v="week">Week summary</button><button class="pill" data-a="edit">Edit</button></span></div>';
  h+=n?'<p>'+DN[idx]+' · '+dn+' of '+n+' exercises done</p><div class="bar"><i style="width:'+Math.round(dn/n*100)+'%"></i></div>':'<p>'+DN[idx]+' · recovery</p>';
  h+='</div>';
  if(!n)h+='<div class="rest"><b>Recovery day</b>Easy walk and a stretch. Want to train today instead? Tap Edit and add exercises.</div>';
  p.g.forEach(function(g){
    var gd=g.x.filter(function(x){return e.ex.indexOf(x.id)>-1}).length;
    h+='<div class="group"><h3>'+esc(g.n)+'<span>'+gd+'/'+g.x.length+'</span></h3>';
    g.x.forEach(function(x){var on=e.ex.indexOf(x.id)>-1;
      h+='<button class="ex'+(on?' on':'')+'" data-a="ex" data-id="'+x.id+'"><span class="tick">'+CK+'</span><span class="nm">'+esc(x.n)+'</span><span class="rx">'+esc(x.r)+'</span></button>'});
    h+='</div>';
  });
  h+='<div class="daily"><h3>Daily log</h3><button class="steps'+(e.steps?' on':'')+'" data-a="steps"><span class="tick">'+CK+'</span><span class="nm">10,000 steps<small class="s">Tap when you hit it</small></span></button>'+
   '<div class="cardio"><span class="nm">Cardio<small class="s">Calories burned</small></span><input class="t" id="kcal" type="number" inputmode="numeric" min="0" max="5000" placeholder="0" value="'+(e.kcal||"")+'" aria-label="Cardio calories"></div>'+
   '<div class="cardio"><span class="nm">Weight<small class="s">kg</small></span><input class="t" id="wt" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="'+fm(prevW(sel))+'" value="'+(S.wt.log[sel]!=null?S.wt.log[sel]:"")+'" aria-label="Weight in kg"></div></div>';
  return h;
}

function editView(idx,p){
  var h='<div class="hero"><div class="row"><h2>Edit '+DN[idx]+'</h2><button class="pill solid" data-a="edit">Done</button></div><p>Rename, change sets, reorder or remove. Saves as you type.</p></div>';
  h+='<div class="group"><div class="ghead"><input class="t" data-f="title" value="'+esc(p.t)+'" aria-label="Day name"></div></div>';
  p.g.forEach(function(g,gi){
    h+='<div class="group"><div class="ghead"><input class="t" data-f="gname" data-g="'+gi+'" value="'+esc(g.n)+'" aria-label="Muscle group"><button class="ib del" data-a="delG" data-g="'+gi+'" aria-label="Remove group">✕</button></div>';
    g.x.forEach(function(x,xi){
      h+='<div class="erow"><input class="t en" data-f="en" data-g="'+gi+'" data-e="'+xi+'" value="'+esc(x.n)+'" aria-label="Exercise">'+
      '<input class="t er" data-f="er" data-g="'+gi+'" data-e="'+xi+'" value="'+esc(x.r)+'" aria-label="Sets and reps">'+
      '<button class="ib" data-a="up" data-g="'+gi+'" data-e="'+xi+'" aria-label="Move up">↑</button>'+
      '<button class="ib del" data-a="del" data-g="'+gi+'" data-e="'+xi+'" aria-label="Remove">✕</button></div>';
    });
    h+='<button class="add" data-a="addEx" data-g="'+gi+'">+ Add exercise</button></div>';
  });
  h+='<button class="pill" style="width:100%;padding:13px" data-a="addG">+ Add muscle group</button>';
  var o='';DN.forEach(function(d,j){if(j!==idx)o+='<option value="'+j+'">'+d+' ('+esc(S.plan[j].t)+')</option>'});
  h+='<div class="edtools"><label>Swap this whole day with<select class="t" id="swap"><option value="">Choose a day…</option>'+o+'</select></label>'+
     '<button class="lnk" data-a="reset">'+(arm==="p"?"Tap again to confirm reset":"Reset all days to the starter plan")+'</button></div>';
  return h;
}

function fm(n){return String(Math.round(n*10)/10)}
function prevW(k){var r=S.wt.base;Object.keys(S.wt.log).sort().forEach(function(x){if(x<=k)r=S.wt.log[x]});return r}
var wmode="day",arm="";
function two(k){if(arm!==k){arm=k;setTimeout(function(){if(arm===k){arm="";render()}},4000);return false}arm="";return true}
function avg(a){return a.reduce(function(x,y){return x+y},0)/a.length}
function weightView(){
  var L=S.wt.log,ks=Object.keys(L).sort(),base=S.wt.base,cur=ks.length?L[ks[ks.length-1]]:base,ch=cur-base,h="";
  h+='<div class="hero"><p style="margin:0">Current weight</p><div class="big">'+fm(cur)+'<span> kg</span></div><span class="chip">'+(ch>0?'+':'')+fm(ch)+' kg since start ('+fm(base)+')</span></div>';
  h+='<div class="daily"><h3>Log today</h3><div class="step"><button class="ib" data-a="wstep" data-d="-0.1" aria-label="Minus 0.1">\u2212</button><input class="t" id="wt2" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="'+fm(prevW(todayIso))+'" value="'+(L[todayIso]!=null?L[todayIso]:"")+'" aria-label="Today weight in kg"><button class="ib" data-a="wstep" data-d="0.1" aria-label="Plus 0.1">+</button></div>'+
   '<div class="cardio"><span class="nm">Starting weight<small class="s">kg</small></span><input class="t" id="wtb" type="number" inputmode="decimal" step="0.1" min="20" max="300" value="'+base+'" aria-label="Starting weight in kg"></div></div>';
  if(ks.length>1){
    var pts=ks.slice(-30).map(function(k){return L[k]}),mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),sp=(mx-mn)||1,n=pts.length,
    co=pts.map(function(v,i){return [i/(n-1)*280+10,64-(v-mn)/sp*50]}),d=co.map(function(c){return c[0].toFixed(1)+","+c[1].toFixed(1)}).join(" "),lc=co[n-1];
    h+='<div class="group" style="padding:12px"><svg viewBox="0 0 300 80" width="100%" height="90" role="img" aria-label="Weight trend"><polygon points="'+d+' 290,76 10,76" fill="var(--acc)" opacity=".12"/><polyline points="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lc[0].toFixed(1)+'" cy="'+lc[1].toFixed(1)+'" r="4.5" fill="var(--acc)"/></svg></div>';
  }
  h+='<div class="seg"><button class="'+(wmode==="day"?"act":"")+'" data-a="wmode" data-v="day">Daily</button><button class="'+(wmode==="week"?"act":"")+'" data-a="wmode" data-v="week">Weekly</button></div>';
  if(wmode==="week"){
    var W={};ks.forEach(function(k){var m=iso(mon(fromIso(k)));(W[m]=W[m]||[]).push(L[k])});
    var wl=Object.keys(W).sort().reverse(),cm=iso(mon(now()));
    h+='<div class="group"><h3>Weekly averages<span>'+wl.length+' '+(wl.length===1?"week":"weeks")+'</span></h3>';
    if(!wl.length)h+='<div class="wh"><span class="d" style="color:var(--soft)">No entries yet.</span></div>';
    wl.slice(0,26).forEach(function(m,i){var a0=avg(W[m]),pm=wl[i+1],dl=a0-(pm?avg(W[pm]):base),d0=fromIso(m),d1=add(d0,6);
      h+='<div class="wh'+(m===cm?" today":"")+'"><span class="d">'+d0.getDate()+' '+MN[d0.getMonth()]+' \u2013 '+d1.getDate()+' '+MN[d1.getMonth()]+(m===cm?' \u00b7 This week':'')+'<small style="margin:0;display:block">'+W[m].length+' '+(W[m].length===1?"entry":"entries")+'</small></span><span><b>'+fm(a0)+' kg</b><small>'+(dl>0?"+":"")+fm(dl)+'</small></span></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="group"><h3>History<span>'+ks.length+' '+(ks.length===1?"entry":"entries")+'</span></h3>';
    if(!ks.length)h+='<div class="wh"><span class="d" style="color:var(--soft)">No entries yet. Log today\u2019s weight above.</span></div>';
    var rk=ks.slice().reverse();
    rk.slice(0,90).forEach(function(k,i){var pv=rk[i+1],dl=L[k]-(pv!==undefined?L[pv]:base),dd=fromIso(k);
      h+='<div class="wh'+(k===todayIso?" today":"")+'"><span class="d">'+DN[idxOf(k)]+' '+dd.getDate()+' '+MN[dd.getMonth()]+(k===todayIso?' \u00b7 Today':'')+'</span><span><b>'+fm(L[k])+' kg</b><small>'+(dl>0?"+":"")+fm(dl)+'</small></span></div>';
    });
    h+='</div>';
  }
  h+='<div class="edtools"><button class="lnk" data-a="wreset">'+(arm==="w"?"Tap again to delete all weight entries":"Reset weight data")+'</button></div>';
  return h;
}
function weekView(days){var wv=[];days.forEach(function(d){var w=S.wt.log[iso(d)];if(w!=null)wv.push(w)});
  return '<div class="daily" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px"><span>Avg weight this week</span><b>'+(wv.length?fm(avg(wv))+' kg':'\u2013')+'</b></div>'+weekView0(days)}
function weekView0(days){
  var steps=0,kcal=0,sess=0,planned=0,exs=0,h="";
  days.forEach(function(d,j){var p=S.plan[j],e=S.log[iso(d)]||{ex:[],steps:false,kcal:0},n=ids(p).length,dn=doneCount(p,e);
    if(n){planned++;if(dn===n)sess++}exs+=dn;if(e.steps)steps++;kcal+=e.kcal||0});
  h+='<div class="stats"><div class="stat"><b>'+sess+'/'+planned+'</b><span>workouts finished</span></div><div class="stat"><b>'+steps+'/7</b><span>10k step days</span></div><div class="stat"><b>'+kcal+'</b><span>cardio kcal</span></div></div>';
  days.forEach(function(d,j){var k=iso(d),p=S.plan[j],e=S.log[k]||{ex:[],steps:false,kcal:0},n=ids(p).length,dn=doneCount(p,e);
    h+='<button class="wd'+(n?'':' rest0')+'" data-a="goday" data-k="'+k+'"><div class="l1"><b>'+DN[j]+' '+d.getDate()+' · '+esc(p.t)+'</b><span>'+(n?dn+'/'+n:'–')+'</span></div>'+
    (n?'<div class="bar"><i style="width:'+Math.round(dn/n*100)+'%"></i></div>':'')+
    '<div class="tags"><span class="tag'+(e.steps?' y':'')+'">'+(e.steps?'10k steps ✓':'no 10k steps')+'</span><span class="tag'+(e.kcal?' y':'')+'">'+(e.kcal?e.kcal+' kcal cardio':'no cardio')+'</span></div></button>';
  });
  return h;
}

function shiftWeek(n){wk=add(wk,n);sel=iso(wk<=now()&&add(wk,6)>=now()?now():wk)}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]");if(!t)return;
  var a=t.dataset.a,p=S.plan[idxOf(sel)],g=+t.dataset.g,e=+t.dataset.e;if(a!=="wreset"&&a!=="reset")arm="";
  if(a==="day"){sel=t.dataset.k;tab="day";edit=false}
  else if(a==="goday"){sel=t.dataset.k;tab="day";edit=false}
  else if(a==="tab"){tab=t.dataset.v;edit=false}
  else if(a==="prev")shiftWeek(-7);
  else if(a==="next")shiftWeek(7);
  else if(a==="edit")edit=!edit;
  else if(a==="ex"){var l=ent(sel),i=l.ex.indexOf(t.dataset.id);if(i>-1)l.ex.splice(i,1);else l.ex.push(t.dataset.id)}
  else if(a==="steps"){var q=ent(sel);q.steps=!q.steps}
  else if(a==="del")p.g[g].x.splice(e,1);
  else if(a==="up"){var xs=p.g[g].x;if(e>0){var tmp=xs[e];xs[e]=xs[e-1];xs[e-1]=tmp}}
  else if(a==="addEx")p.g[g].x.push(X("New exercise","3 × 10"));
  else if(a==="addG")p.g.push(G("New group",[X("New exercise","3 × 10")]));
  else if(a==="delG")p.g.splice(g,1);
  else if(a==="wreset"){if(two("w"))S.wt={base:S.wt.base,log:{}}}
  else if(a==="wmode")wmode=t.dataset.v;
  else if(a==="wstep"){var cv=S.wt.log[todayIso];if(cv==null)cv=prevW(todayIso);S.wt.log[todayIso]=Math.round(Math.max(20,Math.min(300,cv+parseFloat(t.dataset.d)))*10)/10}
  else if(a==="reset"){if(two("p"))S.plan=defPlan()}
  save();render();
});
document.addEventListener("input",function(ev){
  var t=ev.target,f=t.dataset.f;if(!f)return;
  var p=S.plan[idxOf(sel)],g=+t.dataset.g,e=+t.dataset.e;
  if(f==="title")p.t=t.value;else if(f==="gname")p.g[g].n=t.value;
  else if(f==="en")p.g[g].x[e].n=t.value;else if(f==="er")p.g[g].x[e].r=t.value;
  save();
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="kcal"){var v=parseInt(t.value,10);ent(sel).kcal=isNaN(v)?0:Math.max(0,Math.min(5000,v));save();render()}
  else if(t.id==="wt"||t.id==="wt2"){var k=t.id==="wt"?sel:todayIso,v=parseFloat(t.value);if(t.value==="")delete S.wt.log[k];else if(!isNaN(v)&&v>=20&&v<=300)S.wt.log[k]=Math.round(v*10)/10;save();render()}
  else if(t.id==="wtb"){var b=parseFloat(t.value);if(!isNaN(b)&&b>=20&&b<=300)S.wt.base=Math.round(b*10)/10;save();render()}
  else if(t.id==="swap"&&t.value!==""){var i=idxOf(sel),j=+t.value,tmp=S.plan[i];S.plan[i]=S.plan[j];S.plan[j]=tmp;save();render()}
});
function refreshToday(){var t=iso(now());if(t!==todayIso){todayIso=t;wk=mon(now());sel=t;edit=false;render()}}
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshToday()});
window.addEventListener("pageshow",refreshToday);window.addEventListener("focus",refreshToday);setInterval(refreshToday,60000);
try{var c=document.createElement("canvas");c.width=c.height=180;var cx=c.getContext("2d");cx.fillStyle="#5B3DF5";cx.fillRect(0,0,180,180);cx.fillStyle="#fff";cx.font="700 100px -apple-system,Helvetica,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("T",90,95);var lk=document.createElement("link");lk.rel="apple-touch-icon";lk.href=c.toDataURL("image/png");document.head.appendChild(lk)}catch(e){}
render();
})();
</script>
